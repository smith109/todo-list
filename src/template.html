<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="branding">
          <div class="icon">
            <img src="./assets/icons/check.svg" alt="" width="35" height="35">
          </div>
          <h1>Todo List</h1>
        </div>
        <div class="btn-container">
          <button class="add-project-btn" data-modal-btn="projectModalBtn">Add Project</button>
        </div>
        <div class="projects">
          <h2>My Projects</h2>
          <ul class="project-list"></ul>
        </div>
      </div>
      <div class="main-content">
        <div class="todos">
          <div class="header">
            <h2 class="active-project">Inbox</h2>
            <div class="btn-container">
              <button class="add-todo-btn" data-modal-btn="todoModalBtn">Add Task</button>
            </div>
          </div>
          <div class="todo-cards"></div>
        </div>
      </div>
    </div>
    <dialog class="project-modal">
      <form method="dialog" class="project-form">
        <div class="header">
          <h2>Add New Project</h2>
          <button type="button" class="close-btn">&#x2715;</button>
        </div>
        <div class="form-group">
          <label for="project-name">Project Name:</label>
          <input type="text" name="project-name" id="project-name" autofocus required>
          <span class="required-text"></span>
        </div>
        <div class="form-group">
          <button type="button" class="close-btn">Cancel</button>
          <button type="submit">Save Project</button>
        </div>
      </form>
    </dialog>
    <dialog class="todo-modal">
      <form method="dialog" class="todo-form">
        <input type="hidden" id="todoId" name="todoId">
        <div class="header">
          <h2>Add New Task</h2>
          <button type="button" class="close-btn">&#x2715;</button>
        </div>
        <div class="form-group">
          <label for="todo-title">Title:</label>
          <input type="text" name="todo-title" id="todo-title" autofocus required>
          <span class="required-text"></span>
        </div>
        <div class="form-group">
          <label for="todo-description">Description:</label>
          <textarea name="todo-description" id="todo-description" rows="4" cols="25"></textarea>
        </div>
        <div class="form-group">
          <label for="todo-due-date">Due Date:</label>
          <input type="date" name="todo-due-date" id="todo-due-date">
        </div>
        <fieldset class="form-group">
          <legend>Priority</legend>
          <div>
            <input type="radio" name="todo-priority" id="none" value="" required checked>
            <label for="none">None</label>
          </div>
          <div>
            <input type="radio" name="todo-priority" id="low" value="low">
            <label for="low">Low</label>
          </div>
          <div>
            <input type="radio" name="todo-priority" id="medium" value="medium">
            <label for="medium">Medium</label>
          </div>
          <div>
            <input type="radio" name="todo-priority" id="high" value="high">
            <label for="high">High</label>
          </div>
        </fieldset>
        <div class="form-group">
          <button type="button" class="close-btn">Cancel</button>
          <button type="submit">Save Task</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
