<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="branding">
          <div class="icon">
            <img src="./assets/icons/check.svg" alt="" width="35" height="35">
          </div>
          <h1>Todo List</h1>
        </div>
        <div class="btn-container">
          <button class="add-project-btn" data-modal-btn="projectModalBtn">Add Project</button>
        </div>
        <div class="projects">
          <h2>My Projects</h2>
          <ul class="project-list"></ul>
        </div>
      </div>
      <div class="main-content">
        <div class="todos">
          <div class="header">
            <h2 class="active-project">Inbox</h2>
            <div class="btn-container">
              <button class="add-todo-btn">Add Task</button>
            </div>
          </div>
          <div class="todo-cards"></div>
        </div>
      </div>
    </div>
    <dialog class="project-modal">
      <div class="header">
        <h2>Add New Project</h2>
        <button class="close-btn" data-action="closeModal">&#x2715;</button>
      </div>
      <form method="dialog" class="project-form">
        <div class="form-group">
          <label for="project-name">Project Name:</label>
          <input type="text" name="project-name" id="project-name" autofocus required>
          <span class="required-text"></span>
        </div>
        <div class="form-group">
          <button class="close-btn" type="button" data-action="closeModal">Cancel</button>
          <button type="submit" data-action="submitForm">Save Project</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
